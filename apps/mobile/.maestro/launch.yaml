# Launch regression (bug-learnings #1, #2): the app must get past the launch spinner to the real tab bar.
appId: app.geopoll.beta
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "tab-polls"
    timeout: 30000
- assertNotVisible: ".*Something went wrong.*"
- assertVisible:
    id: "tab-settings"
- tapOn:
    id: "tab-settings"
- assertVisible:
    id: "tab-polls"
- takeScreenshot: /tmp/smoke/first-screen
