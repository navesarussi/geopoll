name: באג / Bug
description: דיווח על תקלה (לא פגיעות אבטחה)
labels: ["type:bug", "status:triage"]
body:
  - type: textarea
    id: what
    attributes: {label: מה קרה ומה ציפית}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: שלבים לשחזור}
    validations: {required: true}
  - type: input
    id: env
    attributes: {label: סביבה (מכשיר, גרסה)}
  - type: markdown
    attributes: {value: "**אל תצרפו מידע אישי, צילומי תעודה או פרטי הצבעה.**"}
