# Single aggregating CI. Branch protection should require ONLY the "CI gate" check.
# Pattern learned from KupaPay (no secrets copied). See docs/engineering/ci-cd.md.
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/web
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node scripts/lint.mjs
        working-directory: .
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
  unit:
    name: Unit tests + coverage ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run test:coverage
      - run: node ../../scripts/ci/coverage-ratchet.mjs coverage/coverage-summary.json ../../scripts/ci/coverage-baseline.json
  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Start Postgres (pull with retries; registries rate-limit)
        working-directory: .
        run: |
          for i in 1 2 3 4 5; do docker pull postgres:17 && break; echo "pull failed, retry $i"; sleep $((i*10)); done
          docker run -d --name pg -e POSTGRES_USER=gp -e POSTGRES_PASSWORD=gp -e POSTGRES_DB=gp -p 5432:5432 postgres:17
          for i in $(seq 1 30); do docker exec pg pg_isready -U gp && break; sleep 2; done
      - run: npm ci
      - run: npx vitest run --no-file-parallelism
        env:
          TEST_DATABASE_URL: postgres://gp:gp@localhost:5432/gp
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks CLI (no license key needed)
        working-directory: .
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --no-banner -v
  build:
    name: Build + bundle-size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: node ../../scripts/ci/bundle-budget.mjs .next ../../scripts/ci/bundle-budget.json
      - uses: actions/upload-artifact@v4
        with: { name: next-build, path: apps/web/.next, include-hidden-files: true, retention-days: 1 }
  lighthouse:
    name: Lighthouse (advisory)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: apps/web/.next }
      - run: |
          (npx next start -p 3000 > /tmp/next.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/ >/dev/null && break; sleep 2; done
          npx --yes @lhci/cli@0.14.x autorun --config=../../lighthouserc.cjs || echo "::warning::Lighthouse below targets (advisory)"
        env:
          DEMO_LOGIN: "1"
          NEXTAUTH_SECRET: ci-only-not-a-secret
  mobile:
    name: Mobile (typecheck, tests, iOS bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: "apps/*/package-lock.json" }
      - run: npm ci
        working-directory: apps/web # mobile tests run the real web issuer (apps/web/lib/crypto.ts)
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform ios --output-dir /tmp/expo-export # Metro resolves packages/*; no EAS, no secrets
  ci-gate:
    name: CI gate
    if: always()
    needs: [lint, typecheck, unit, integration, gitleaks, build, lighthouse, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - working-directory: .
        run: >
          bash scripts/ci/gate-verify.sh
          lint "${{ needs.lint.result }}"
          typecheck "${{ needs.typecheck.result }}"
          unit "${{ needs.unit.result }}"
          integration "${{ needs.integration.result }}"
          gitleaks "${{ needs.gitleaks.result }}"
          build "${{ needs.build.result }}"
          mobile "${{ needs.mobile.result }}"
