name: web
on:
  push:
    branches: [main]
    paths: ["apps/web/**"]
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web.yml"]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gp
          POSTGRES_PASSWORD: gp
          POSTGRES_DB: gp
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: tests on real Postgres
        run: npx vitest run --no-file-parallelism
        env:
          TEST_DATABASE_URL: postgres://gp:gp@localhost:5432/gp
      - run: npm run build
