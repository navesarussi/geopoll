# EAS ops for apps/mobile. FREE tier only. Android preview (internal APK) only – no iOS until Apple app record/name exist.
# Triggers: manual dispatch, or push to ops/* (dispatch only works for workflows on main – KupaPay lesson).
# EXPO_TOKEN is a robot token (geopoll-ci); it is only passed via env and never echoed.
name: Mobile EAS
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Run Android preview build"
        type: boolean
        default: true
  push:
    branches: ["ops/**"]
concurrency: { group: mobile-eas, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  eas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - name: Check token present (value never printed)
        run: test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN secret missing"; exit 1; }
      - run: npx --yes eas-cli@latest whoami
      - name: eas init (link/create project under owner saussilberg)
        run: |
          npx --yes eas-cli@latest init --non-interactive --force
          node -e 'const c=require("./app.json").expo; console.log("projectId=" + (c.extra?.eas?.projectId ?? "MISSING"), "owner=" + c.owner)'
      - name: Upload linked app.json (commit projectId via PR)
        uses: actions/upload-artifact@v4
        with: { name: app-json-linked, path: apps/mobile/app.json }
      - name: Android preview build (internal APK, free tier, no wait)
        if: github.event_name == 'push' || inputs.build
        run: |
          npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --no-wait --json > /tmp/build.json
          node -e 'const b=JSON.parse(require("fs").readFileSync("/tmp/build.json","utf8"))[0]; console.log("buildId=" + b.id, "url=https://expo.dev/accounts/saussilberg/projects/geopoll/builds/" + b.id)'
