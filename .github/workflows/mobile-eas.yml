# EAS ops for apps/mobile on the FREE tier. Priority: iOS → TestFlight. Android preview is optional (off by default).
# Triggers: workflow_dispatch (on main) or push to ops/** (dispatch only works for workflows on main – KupaPay lesson).
# Secrets (values never echoed): EXPO_TOKEN (robot geopoll-ci), ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY_P8,
# APPLE_TEAM_ID, ASC_APP_ID (App Store Connect app record "Apple ID"). Name/bundle id are working values (app.config.ts).
name: Mobile EAS
on:
  workflow_dispatch:
    inputs:
      ios:
        description: "iOS production build + submit to TestFlight"
        type: boolean
        default: true
      android:
        description: "Android preview APK (internal)"
        type: boolean
        default: false
  push:
    branches: ["ops/**"]
concurrency: { group: mobile-eas, cancel-in-progress: false }
permissions:
  contents: read
env:
  EAS: npx --yes eas-cli@latest
jobs:
  init:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN secret missing"; exit 1; }
      - run: $EAS whoami
      - name: eas init (link/create project under owner saussilberg)
        run: |
          $EAS init --non-interactive --force
          node -e 'const c=require("./app.json").expo; console.log("projectId=" + (c.extra?.eas?.projectId ?? "MISSING"), "owner=" + c.owner)'
      - uses: actions/upload-artifact@v4
        with: { name: app-json-linked, path: apps/mobile/app.json }

  ios:
    needs: init
    if: github.event_name == 'push' || inputs.ios
    runs-on: ubuntu-latest
    timeout-minutes: 240 # free-tier queue can be slow
    defaults: { run: { working-directory: apps/mobile } }
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: app-json-linked, path: apps/mobile }
      - name: Check Apple secrets present (values never printed)
        run: |
          miss=0; for v in ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8 APPLE_TEAM_ID ASC_APP_ID; do [ -n "${!v}" ] || { echo "::error::missing secret $v"; miss=1; }; done; exit $miss
      - name: Write ASC key + submit config (file is gitignored, job-local)
        run: |
          umask 077; printf '%s\n' "$ASC_API_KEY_P8" > asc_api_key.p8
          node -e 'const f="eas.json",j=require("./"+f),i=j.submit.production.ios; i.ascAppId=process.env.ASC_APP_ID; i.ascApiKeyIssuerId=process.env.ASC_API_ISSUER_ID; i.ascApiKeyId=process.env.ASC_API_KEY_ID; require("fs").writeFileSync(f,JSON.stringify(j,null,2))'
      - name: Set up iOS credentials once (EAS-managed; non-interactive builds can't create them – answered via expect, defaults = generate)
        env:
          EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/apps/mobile/asc_api_key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          EXPO_NO_CAPABILITY_SYNC: "1" # ASC API rejects PUSH_NOTIFICATIONS patch; enable Push manually in developer portal
        run: |
          sudo apt-get install -y -qq expect >/dev/null
          cat > /tmp/creds.exp <<'EXP'
          set timeout 300
          spawn npx --yes eas-cli@latest credentials:configure-build -p ios -e production
          expect {
            -re {[Pp]ush [Nn]otifications.*\?} { send "n\r"; exp_continue }
            -re {\(Y/n\)} { send "Y\r"; exp_continue }
            -re {\(y/N\)} { send "y\r"; exp_continue }
            -re {›.*\r?\n} { exp_continue }
            eof
          }
          catch wait r; exit [lindex $r 3]
          EXP
          expect /tmp/creds.exp
      - name: iOS production build (EAS-managed cert/profile via ASC API key, free tier)
        env:
          EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/apps/mobile/asc_api_key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          EXPO_NO_CAPABILITY_SYNC: "1" # ASC API rejects PUSH_NOTIFICATIONS patch; enable Push manually in developer portal
        run: |
          $EAS build --platform ios --profile production --non-interactive --wait --json > /tmp/ios.json
          node -e 'const b=JSON.parse(require("fs").readFileSync("/tmp/ios.json","utf8"))[0]; console.log("buildId=" + b.id, "status=" + b.status, "url=https://expo.dev/accounts/saussilberg/projects/geopoll/builds/" + b.id)'
      - name: Submit to TestFlight
        run: $EAS submit --platform ios --profile production --latest --non-interactive
      - if: always()
        run: rm -f asc_api_key.p8

  android:
    needs: init
    if: github.event_name == 'workflow_dispatch' && inputs.android
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: app-json-linked, path: apps/mobile }
      - run: |
          $EAS build --platform android --profile preview --non-interactive --no-wait --json > /tmp/a.json
          node -e 'const b=JSON.parse(require("fs").readFileSync("/tmp/a.json","utf8"))[0]; console.log("buildId=" + b.id, "url=https://expo.dev/accounts/saussilberg/projects/geopoll/builds/" + b.id)'
