# Weekly grouped updates. Security updates are separate (enable "Dependabot security updates" in repo settings).
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Jerusalem }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      next-react: { patterns: ["next", "react", "react-dom", "@types/react*", "next-auth"] }
      crypto: { patterns: ["@cloudflare/*"] }
      dev-tooling: { dependency-type: development }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Jerusalem }
    labels: [dependencies, ci]
    groups:
      actions: { patterns: ["*"] }
